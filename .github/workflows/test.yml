name: test-js-project

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: "02 Starting Project"
        run: npm ci

      - name: Run tests
        working-directory: "02 Starting Project"
        run: npm test